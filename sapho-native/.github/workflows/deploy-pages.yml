name: Deploy Website 2.0 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'articles/**'
      - 'daily/**'
      - 'public/site/**'
      - 'scripts/**'
      - 'state/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Render Website 2.0
        env:
          SAPHO_SITE_MODE: github-pages
          SAPHO_SITE_BASE_URL: https://research.quiznat.com
          SAPHO_SITE_CUSTOM_DOMAIN: research.quiznat.com
        run: python scripts/render_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
